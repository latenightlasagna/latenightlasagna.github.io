<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DreamOS Emulator</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #008080;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      user-select: none;
    }

    .monitor-wrapper {
      position: relative;
      width: 100%;
      height: 100%;
      max-width: 1000px;
      max-height: 750px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .monitor-bezel {
      position: relative;
      width: 100%;
      height: auto;
      max-height: 100%;
      object-fit: contain;
      pointer-events: none;
      z-index: 10;
    }

    /* Precisely mapped to your CRT bezel cutout ratios */
    #canvas-container {
      position: absolute;
      z-index: 1;
      background-color: #000;
      top: 13.75%;
      left: 10.6%;
      width: 79.8%;
      height: 74.0%;
    }

    canvas {
      width: 100% !important;
      height: 100% !important;
      display: block;
      image-rendering: pixelated;
    }
  </style>
</head>
<body>

  <div class="monitor-wrapper">
    <div id="canvas-container"></div>
    <!-- Make sure ComputerFrame.png is inside projects/dream-os/assets/ -->
    <img src="assets/ComputerFrame.png" class="monitor-bezel" alt="CRT Monitor">
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/addons/p5.sound.min.js"></script>
  <script src="https://unpkg.com/ml5@1/dist/ml5.js"></script>
  <script src="sketch.js"></script>
</body>
</html>
